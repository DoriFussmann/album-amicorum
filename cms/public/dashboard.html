<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS — Dashboard · Album Amicorum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Nunito:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/cms.css" />
  </head>
  <body>
    <header class="cms-header">
      <div class="site-shell cms-header__inner">
        <a class="brand" href="/">
          <span class="brand__name">Album Amicorum</span>
          <span class="brand__meta">Local CMS</span>
        </a>
        <nav class="cms-nav" aria-label="CMS">
          <a href="/">Articles</a>
          <a href="/team.html">Team</a>
          <a href="/dashboard.html" aria-current="page">Dashboard</a>
        </nav>
      </div>
    </header>

    <main class="site-shell">
      <div class="page-intro">
        <h1>Article health dashboard</h1>
        <p>Quick view of drafts, link counts, FAQs, and last updates.</p>
      </div>

      <p id="dash-error" class="alert alert-error" role="alert" hidden></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>title</th>
              <th>slug</th>
              <th>draft</th>
              <th>internalLinks</th>
              <th>externalLinks</th>
              <th>faqs</th>
              <th>updatedDate</th>
            </tr>
          </thead>
          <tbody id="dash-body">
            <tr>
              <td colspan="7">Loading…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <script>
      async function parseJson(res) {
        const ct = res.headers.get('content-type') || '';
        if (!ct.includes('application/json')) {
          const text = await res.text();
          throw new Error(text || `HTTP ${res.status}`);
        }
        return res.json();
      }

      (async () => {
        const tbody = document.getElementById('dash-body');
        const err = document.getElementById('dash-error');
        try {
          const res = await fetch('/articles');
          const data = await parseJson(res);
          if (!res.ok || !data.ok) throw new Error(data.error || 'Failed to load');
          tbody.innerHTML = '';
          if (!data.articles.length) {
            tbody.innerHTML = '<tr><td colspan="7">No articles</td></tr>';
            return;
          }
          for (const a of data.articles) {
            const tr = document.createElement('tr');
            const updated = a.updatedDate
              ? new Date(a.updatedDate).toISOString().slice(0, 10)
              : '';
            tr.innerHTML = `
              <td>${escapeHtml(a.title)}</td>
              <td>${escapeHtml(a.slug)}</td>
              <td>${a.draft ? '<span class="status-pill is-blocked">true</span>' : '<span class="status-pill is-ready">false</span>'}</td>
              <td>${(a.internalLinks || []).length}</td>
              <td>${(a.externalLinks || []).length}</td>
              <td>${(a.faqs || []).length}</td>
              <td>${updated}</td>`;
            tbody.appendChild(tr);
          }
        } catch (e) {
          err.hidden = false;
          err.textContent = e.message;
          tbody.innerHTML = '';
        }
      })();

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
    </script>
  </body>
</html>
