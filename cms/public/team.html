<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS — Team · Album Amicorum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Nunito:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/cms.css" />
  </head>
  <body>
    <header class="cms-header">
      <div class="site-shell cms-header__inner">
        <a class="brand" href="/">
          <span class="brand__name">Album Amicorum</span>
          <span class="brand__meta">Local CMS</span>
        </a>
      </div>
    </header>

    <div class="cms-shell">
      <aside class="cms-sidebar" aria-label="CMS navigation">
        <ul class="sidebar-nav">
          <li><a href="/">Articles</a></li>
          <li><a href="/add-article.html">Add Article</a></li>
          <li><a href="/bulk-add.html">Bulk Add</a></li>
          <li><a href="/articles-health.html">Articles Health</a></li>
          <li><a href="/team.html" aria-current="page">Team</a></li>
          <li><a href="/dashboard.html">Dashboard</a></li>
        </ul>
      </aside>

      <div class="cms-main">
        <main class="site-shell">
          <div class="page-intro">
            <h1>New / Edit Team Member</h1>
            <p>Authors available in the article form come from this list.</p>
          </div>

          <div class="stack">
            <section class="panel" aria-labelledby="list-heading">
              <h2 id="list-heading">Existing team</h2>
              <ul class="plain-list" id="team-list">
                <li>Loading…</li>
              </ul>
            </section>

            <section class="panel" aria-labelledby="form-heading">
              <h2 id="form-heading">Team member form</h2>
              <p id="team-error" class="alert alert-error" role="alert" hidden></p>
              <p id="team-success" class="alert alert-success" hidden></p>
              <form id="team-form" class="field-grid">
                <div class="field-grid cols-2">
                  <label class="field">
                    <span>name</span>
                    <input name="name" id="tm-name" required />
                  </label>
                  <label class="field">
                    <span>slug</span>
                    <input name="slug" id="tm-slug" required />
                  </label>
                  <label class="field">
                    <span>role</span>
                    <input name="role" id="tm-role" required />
                  </label>
                  <label class="field">
                    <span>credentials (optional)</span>
                    <input name="credentials" id="tm-credentials" />
                  </label>
                </div>
                <label class="field">
                  <span>bio</span>
                  <textarea name="bio" id="tm-bio" rows="4" required></textarea>
                </label>
                <label class="field">
                  <span>sameAs (one URL per line)</span>
                  <textarea name="sameAs" id="tm-sameAs" rows="3"></textarea>
                </label>
                <label class="field">
                  <span>photo (required for new; optional on edit if already set)</span>
                  <input type="file" name="photo" id="tm-photo" accept="image/*" />
                </label>
                <p id="existing-photo" class="field-hint" hidden></p>
                <label class="check-row">
                  <input type="checkbox" id="tm-overwrite" />
                  <span>Overwrite existing slug</span>
                </label>
                <div class="btn-row">
                  <button type="submit" class="btn btn-primary">Save team member</button>
                  <button type="button" class="btn btn-ghost" id="tm-reset">Reset form</button>
                </div>
              </form>
            </section>
          </div>
        </main>
      </div>
    </div>

    <div id="toast-host" class="toast-host" aria-live="polite"></div>

    <script>
      async function parseJson(res) {
        const ct = res.headers.get('content-type') || '';
        if (!ct.includes('application/json')) {
          const text = await res.text();
          throw new Error(text || `HTTP ${res.status}`);
        }
        return res.json();
      }

      const listEl = document.getElementById('team-list');
      const errEl = document.getElementById('team-error');
      const okEl = document.getElementById('team-success');
      const toastHost = document.getElementById('toast-host');
      let editingSlug = null;
      let existingPhoto = null;

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function showToast(message, type, title) {
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.innerHTML = `<span class="toast__title">${escapeHtml(title)}</span>${escapeHtml(message)}`;
        toastHost.appendChild(toast);
        setTimeout(() => {
          toast.classList.add('is-leaving');
          setTimeout(() => toast.remove(), 220);
        }, 4200);
      }

      function showError(msg) {
        errEl.hidden = false;
        errEl.textContent = msg;
        okEl.hidden = true;
        showToast(msg, 'error', 'Error');
      }
      function showOk(msg) {
        okEl.hidden = false;
        okEl.textContent = msg;
        errEl.hidden = true;
        showToast(msg, 'success', 'Saved');
      }

      async function loadTeam() {
        try {
          const res = await fetch('/api/team');
          const data = await parseJson(res);
          if (!res.ok || !data.ok) throw new Error(data.error || 'Failed to load team');
          listEl.innerHTML = '';
          if (!data.team.length) {
            listEl.innerHTML = '<li>No team members yet.</li>';
            return;
          }
          for (const m of data.team) {
            const li = document.createElement('li');
            li.className = 'team-item';
            li.innerHTML = `<strong>${escapeHtml(m.name)}</strong>
              <span class="status-pill">${escapeHtml(m.slug)}</span>
              <span class="field-hint">${escapeHtml(m.role || '')}</span>
              <button type="button" class="btn btn-ghost" data-edit="${escapeHtml(m.slug)}">Edit</button>
              <button type="button" class="btn btn-danger" data-delete="${escapeHtml(m.slug)}">Delete</button>`;
            listEl.appendChild(li);
          }
          listEl.querySelectorAll('[data-edit]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const m = data.team.find((t) => t.slug === btn.getAttribute('data-edit'));
              if (!m) return;
              editingSlug = m.slug;
              existingPhoto = m.photo;
              document.getElementById('tm-name').value = m.name || '';
              document.getElementById('tm-slug').value = m.slug || '';
              document.getElementById('tm-role').value = m.role || '';
              document.getElementById('tm-bio').value = m.bio || '';
              document.getElementById('tm-credentials').value = m.credentials || '';
              document.getElementById('tm-sameAs').value = (m.sameAs || []).join('\n');
              document.getElementById('tm-overwrite').checked = true;
              const ep = document.getElementById('existing-photo');
              ep.hidden = false;
              ep.textContent = `Existing photo path: ${m.photo}`;
            });
          });
          listEl.querySelectorAll('[data-delete]').forEach((btn) => {
            btn.addEventListener('click', async () => {
              const slug = btn.getAttribute('data-delete');
              if (!confirm(`Delete team member ${slug}?`)) return;
              try {
                const res = await fetch(`/api/team/${slug}`, { method: 'DELETE' });
                const data = await parseJson(res);
                if (!res.ok || !data.ok) throw new Error(data.error || 'Delete failed');
                showOk(`Deleted ${slug}`);
                loadTeam();
              } catch (e) {
                showError(e.message);
              }
            });
          });
        } catch (e) {
          listEl.innerHTML = `<li>Error: ${escapeHtml(e.message)}</li>`;
        }
      }

      document.getElementById('tm-reset').addEventListener('click', () => {
        editingSlug = null;
        existingPhoto = null;
        document.getElementById('team-form').reset();
        document.getElementById('existing-photo').hidden = true;
      });

      document.getElementById('team-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        errEl.hidden = true;
        okEl.hidden = true;
        const fd = new FormData();
        fd.append('name', document.getElementById('tm-name').value);
        fd.append('slug', document.getElementById('tm-slug').value);
        fd.append('role', document.getElementById('tm-role').value);
        fd.append('bio', document.getElementById('tm-bio').value);
        fd.append('credentials', document.getElementById('tm-credentials').value);
        const sameAs = document
          .getElementById('tm-sameAs')
          .value.split('\n')
          .map((s) => s.trim())
          .filter(Boolean);
        fd.append('sameAs', JSON.stringify(sameAs));
        fd.append('overwrite', document.getElementById('tm-overwrite').checked ? 'true' : 'false');
        if (existingPhoto) fd.append('existingPhoto', existingPhoto);
        const photo = document.getElementById('tm-photo').files[0];
        if (photo) fd.append('photo', photo);

        try {
          const res = await fetch('/api/team', { method: 'POST', body: fd });
          const data = await parseJson(res);
          if (!res.ok || !data.ok) throw new Error(data.error || 'Save failed');
          showOk(`Saved ${data.slug}`);
          loadTeam();
        } catch (e) {
          showError(e.message);
        }
      });

      loadTeam();
    </script>
  </body>
</html>
