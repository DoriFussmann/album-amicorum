name: IndexNow

# After each successful production deploy, tell IndexNow (Bing and partners)
# which pages changed since the previous production deploy.
# This Vercel project reports deploys to GitHub as a commit status named
# "Vercel" (it does not create GitHub deployments), so the trigger is the
# status event, limited to commits on main.
# Run by hand with a list of URLs to submit specific pages.
on:
  status:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs or paths to submit, separated by spaces"
        required: true

permissions:
  contents: read
  statuses: read

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.context == 'Vercel' &&
       github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Submit specific URLs
        if: github.event_name == 'workflow_dispatch'
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: node site/scripts/indexnow.mjs $URLS

      - name: Submit pages changed since the previous production deploy
        if: github.event_name == 'status'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.sha }}
        run: |
          if ! git merge-base --is-ancestor "$HEAD_SHA" HEAD; then
            echo "$HEAD_SHA is not on main; skipping."
            exit 0
          fi
          # Previous production deploy = the nearest earlier commit on main
          # that Vercel reported as successfully deployed.
          BASE_SHA=""
          for sha in $(git rev-list --first-parent -n 30 "$HEAD_SHA~1"); do
            state=$(gh api "repos/${{ github.repository }}/commits/$sha/statuses" \
              --jq '[.[] | select(.context == "Vercel" and .state == "success")] | length')
            if [ "$state" -gt 0 ]; then BASE_SHA="$sha"; break; fi
          done
          if [ -z "$BASE_SHA" ]; then
            echo "No previous production deploy found; nothing to compare."
            exit 0
          fi
          echo "Comparing $BASE_SHA..$HEAD_SHA"
          node site/scripts/indexnow.mjs --diff "$BASE_SHA" "$HEAD_SHA"
