      ## Orders

      When you check out, you are offering to buy the items in your cart. We accept the order when we send your confirmation email. If an item is unavailable or an order cannot be fulfilled, we will tell you and refund any payment in full.

      ## Prices and payment

      Prices are shown in US dollars and include the book only. Shipping is a flat rate shown at checkout. Payment is processed securely by Stripe at the time of your order.

      ## Shipping

      See [Shipping & Returns](/shipping-returns/) for where we ship, delivery, and what to do if something arrives damaged.

      ## Intellectual property

      The illustrations, designs, text, and images on this site and in My Friends Book belong to Album Amicorum. You may not copy or resell them without written permission.

      ## Using the site

      Please don't misuse the site or attempt to interfere with how it works. Articles are for general information and are not professional advice.

      ## Contact

