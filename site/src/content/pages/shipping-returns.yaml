route: /shipping-returns/
meta_title: Shipping & Returns for My Friends Book | Album Amicorum
meta_description: Shipping costs, delivery times and returns for My Friends Book. One flat $7 rate per order, delivery in up to 7 days, to more than 40 countries.
sections:
  - type: page-header
    eyebrow: Help
    h1: Shipping & Returns
    intro: One flat shipping rate, shown at checkout before you pay.
  - type: rich-text
    body: |
      ## Shipping

      - **Cost.** A flat $7 per order, added at checkout.
      - **Delivery time.** Up to 7 days, depending on where you are. If the book is for a date, like a birthday or the last day of school, order at least a week ahead and leave time for friends to fill their pages.
      - **Where we ship.** More than 40 countries across North America, Europe, Asia-Pacific, the Middle East, Africa, and Latin America. If your country is not listed at checkout, [email us](mailto:hello@albumamicorum.com) and we will see what we can do.
      - **Order updates.** You will receive a confirmation email when your order is placed.

      ## Returns

      - **30 days, any condition.** You can return your book within 30 days of delivery, whether it is new, opened, or already has pages filled in.
      - **Return shipping is on us.** Email [hello@albumamicorum.com](mailto:hello@albumamicorum.com) with your order email and we will send you what you need to return it.
      - **Fast refunds.** Once your return arrives, the money is back in your account within 5 business days.

      ## Bought on Amazon?

      All seven editions are also sold on Amazon in the US; each edition's page here links to its Amazon listing. For an Amazon order, start a return or ask a question from Your Orders on Amazon; Amazon's return process applies there.

      ## Damaged or wrong item

      If your book arrives damaged or you received the wrong edition, email [hello@albumamicorum.com](mailto:hello@albumamicorum.com) with your order email and a photo, and we will make it right.
