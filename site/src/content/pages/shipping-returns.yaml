      ## Shipping

      - **Cost.** A flat $7 per order, added at checkout.
      - **Where we ship.** More than 40 countries across North America, Europe, Asia-Pacific, the Middle East, Africa, and Latin America. If your country is not listed at checkout, [email us](mailto:hello@albumamicorum.com) and we will see what we can do.
      - **Order updates.** You will receive a confirmation email when your order is placed.

