  - type: feature-split
    id: what-is
    eyebrow: What is it?
    heading: A book your child's friends fill in.
    body: Your child hands the book to a friend, a cousin or a teacher. They fill in their two pages with their name, favorite things, a memory, a drawing and a message, then it goes to the next friend. Thirty friends later, it is a record of the people in your child's life, in their own handwriting.
    highlights:
      - title: Every friend gets two pages
        text: Name, favorites, a memory and a drawing, in their own words.
      - title: Written by hand
        text: No screens, no typing. Just pencils, crayons and real handwriting.
      - title: Made to keep
        text: A sturdy square hardcover, built to be passed around and kept for years.
    image: The Space edition of My Friends Book on a table with wooden toys.
    alt: The Space edition of My Friends Book on a table with wooden toys
    src: src/assets/images/books/space/08-front-alt.jpg
  - type: collection
    id: collection
    eyebrow: Choose a design
    heading: Seven designs, same book.
    intro: Every edition has the same pages. Only the illustrations change, so pick the one your child will love showing off.
  - type: process
    id: how-it-works
    eyebrow: How it works
    heading: Three steps, thirty friends.
    steps:
      - title: Your child starts it
        text: They fill in the first two pages with their name, favorites and a drawing. The bookmark marks the next empty page.
      - title: Friends take a turn
        text: Pass it to classmates, cousins, a teacher or a coach. Each one fills in two pages.
      - title: You keep it
        text: When the pages are full, it is a book of the people who mattered at that age.
  - type: feature-grid
    id: why-parents
    eyebrow: Why parents buy it
    heading: A gift that isn't another toy.
    items:
      - title: Screen-free
        text: Something kids hold, pass around and come back to.
      - title: Easy for little hands
        text: Simple prompts and room to draw, so younger friends can join in.
      - title: For any occasion
        text: Birthdays, the last day of school, summer camp or moving away.
      - title: Looks good on a shelf
        text: Soft colors and illustrations that fit a calm, natural room.
  - type: feature-split
    id: story
    eyebrow: Our story
    heading: Inspired by a tradition that began 500 years ago.
    body: Some 500 years ago, students traveling across Renaissance Europe carried small books from place to place, inviting friends and teachers to leave handwritten messages, poems, drawings, and signatures along the way. These books became known as Album Amicorum, Latin for "Book of Friends." My Friends Book brings the same idea to childhood.
    highlights:
      - title: Book of Friends
        text: Album amicorum is Latin for "Book of Friends", a habit people kept for centuries.
      - title: Carried into childhood
        text: The same idea, made for children ages 5–12 and the friends who fill their pages.
    image: Watercolor of a young traveler carrying a book along a forest path, with a castle in the distance.
    alt: Watercolor of a young traveler carrying a book along a forest path, with a castle in the distance
    src: src/assets/images/story.jpg
  - type: faq
    id: faq
    eyebrow: Questions
    heading: Good to know
    items:
      - q: What is a friend book?
        a: A friend book is a fill-in book a child passes to friends, family, and teachers. Each person fills two pages by hand with memories, favorite things, drawings, and a message, so the finished book becomes a one-of-a-kind record of the people in that child's life.
      - q: What ages is My Friends Book for?
        a: My Friends Book is made for children ages 5–12, from the first school years through the end of elementary school.
      - q: How many editions are there?
        a: There are seven illustrated editions (Mermaids, Flowers, Space, Fairies, Forest, Dinosaurs and Animals). Every edition works the same way; only the illustrated world changes.
      - q: How much does it cost and where do you ship?
        a: Each edition is $30. Shipping is a flat $7 per order, and we ship to more than 40 countries.
      - q: Can I buy My Friends Book on Amazon?
        a: Yes. All seven editions are on Amazon in the US, at the same $30 price. Buying here on our site ships to more than 40 countries.
      - q: How long does delivery take?
        a: Up to 7 days, depending on where you are. If the book is for a date, like a birthday or the last day of school, order at least a week ahead and leave time for friends to fill their pages.
      - q: How many friends can fill one book?
        a: Each book has 64 pages, with room for 30 friends (two pages each). For a bigger class or group, get a second book.
      - q: Where does the name Album Amicorum come from?
        a: Album amicorum is Latin for "Book of Friends." Students in Renaissance Europe carried these books on their travels and collected handwritten entries from the friends and teachers they met.
