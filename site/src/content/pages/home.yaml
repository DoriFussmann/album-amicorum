  - type: feature-split
    id: what-is
    eyebrow: What is My Friends Book?
    heading: A book that becomes the story of childhood friendships.
    body: My Friends Book is a beautifully illustrated Friend Book where friends leave behind handwritten memories, drawings, favorite things, and little pieces of themselves. As each page is filled, the book becomes something no one else will ever own — a one-of-a-kind keepsake created by the people who matter most.
    highlights:
      - title: Every friend leaves a page
        text: Each friend adds their own memories, drawings, and handwriting, making every page as unique as the person who created it.
      - title: Written by hand
        text: Some memories deserve more than a screen. Handwriting captures personality in a way nothing else can.
      - title: Made to be treasured
        text: Long after childhood has passed, My Friends Book becomes a keepsake filled with the voices, creativity, and friendships that shaped those years.
    image: Two children on the beach sharing a Mermaids edition of My Friends Book.
    alt: Two children on the beach sharing a Mermaids edition of My Friends Book
    src: src/assets/images/what-is.jpg
  - type: collection
    id: collection
    eyebrow: Choose a world
    heading: Seven editions, one story.
    intro: Every edition tells the same story. Choose the world your child will be excited to share with friends.
  - type: process
    id: how-it-works
    eyebrow: The journey
    heading: A page, a friend, a lifetime.
    steps:
      - title: A page gets filled
        text: It starts with a name, a few favorites, and whatever makes you you right now. Then the bookmark slides forward, leaving the next page open for someone else.
      - title: Passed to a friend
        text: The book goes wherever the people are — a friend, a cousin, a teacher, a coach — anyone who has made life a little brighter.
      - title: Kept for years
        text: Each person leaves a page, a drawing, a bit of themselves. Long after, it is still a book full of people who loved you.
  - type: feature-grid
    id: why-parents
    eyebrow: Why parents love it
    heading: Something real to hold on to.
    items:
      - title: Screen-free connection
        text: A quiet alternative to digital keepsakes — something children can hold, turn, and return to.
      - title: Made for little hands
        text: Thoughtful paper, gentle prompts, and space to draw so every age can leave a mark.
      - title: Gifts that grow meaning
        text: Perfect for birthdays, school years, and farewells — a keepsake for years to come.
      - title: Beautiful on the shelf
        text: Soft covers and natural tones that feel at home in a Waldorf-inspired room.
  - type: feature-split
    id: story
    eyebrow: Our story
    heading: Inspired by a tradition that began more than 450 years ago.
    body: More than four centuries ago, students traveling across Renaissance Europe carried small books from place to place, inviting friends and teachers to leave handwritten messages, poems, drawings, and signatures along the way. These books became known as Album Amicorum — Latin for "Book of Friends." Today, My Friends Book carries the same spirit into childhood, one handwritten page at a time.
    highlights:
      - title: Book of Friends
        text: Album amicorum is Latin for "Book of Friends" — a name for a habit people kept for centuries.
      - title: Carried into childhood
        text: The same idea, made for children ages 5–12 and the friends who fill their pages.
    image: Watercolor of a young traveler carrying a book along a forest path, with a castle in the distance.
    alt: Watercolor of a young traveler carrying a book along a forest path, with a castle in the distance
    src: src/assets/images/story.jpg
  - type: testimonials
    id: testimonials
    heading: A keepsake for years to come.
    items:
      - quote: My daughter carried her Friend Book everywhere that summer. Looking through it now feels like opening a little time capsule.
        name: Parent
        role: My Friends Book family
      - quote: The illustrations are beautiful, but it's the handwriting that makes it so special. Every page feels like a memory.
        name: Parent
        role: My Friends Book family
      - quote: It has become one of the books we reach for most often — not to read, but to remember.
        name: Parent
        role: My Friends Book family
  - type: faq
    id: faq
    eyebrow: Questions
    heading: Good to know
    items:
      - q: What is a friend book?
        a: A friend book is a fill-in book a child passes to friends, family, and teachers. Each person fills a page by hand with memories, favorite things, drawings, and a message, so the finished book becomes a one-of-a-kind record of the people in that child's life.
      - q: What ages is My Friends Book for?
        a: My Friends Book is made for children ages 5–12, from the first school years through the end of elementary school.
      - q: How many editions are there?
        a: There are seven illustrated editions — Mermaids, Flowers, Space, Fairies, Forest, Dinosaurs, and Animals. Every edition works the same way; only the illustrated world changes.
      - q: How much does it cost and where do you ship?
        a: Each edition is $30. Shipping is a flat rate added at checkout, and we ship to more than 40 countries.
      - q: Where does the name Album Amicorum come from?
        a: Album amicorum is Latin for "Book of Friends." Students in Renaissance Europe carried these books on their travels and collected handwritten entries from the friends and teachers they met.
